[workspace]
resolver = "3"
members = [
    "crates/intranet-crypto",
    "crates/intranet-identity",
    "crates/intranet-governance",
    "crates/intranet-invite",
    "crates/intranet-transport",
    "crates/intranet-harness",
    "crates/intranet-ledger",
    "crates/intranet-storage",
    "crates/intranet-epoch",
    "crates/intranet-search",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[workspace.dependencies]
intranet-crypto = { path = "crates/intranet-crypto" }
intranet-identity = { path = "crates/intranet-identity" }
intranet-governance = { path = "crates/intranet-governance" }
intranet-invite = { path = "crates/intranet-invite" }
intranet-transport = { path = "crates/intranet-transport" }
intranet-ledger = { path = "crates/intranet-ledger" }
intranet-storage = { path = "crates/intranet-storage" }
intranet-epoch = { path = "crates/intranet-epoch" }
intranet-search = { path = "crates/intranet-search" }

bip39 = "2.2"
chacha20poly1305 = "0.11"
fastcdc = "4.0"
openmls = "0.8"
openmls_basic_credential = "0.5"
openmls_rust_crypto = "0.5"
openmls_traits = "0.5"
clap = { version = "4", features = ["derive"] }
futures = "0.3"
libp2p = { version = "0.56", features = ["tcp", "quic", "noise", "yamux", "kad", "mdns", "relay", "dcutr", "identify", "ping", "tokio", "macros", "ed25519"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "io-util", "signal"] }
tracing = "0.1"
blake3 = "1.8"
ed25519-dalek = "3.0"
getrandom = "0.3"
libp2p-identity = { version = "0.2", features = ["ed25519", "peerid"] }
slip10_ed25519 = "0.1"
thiserror = "2"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
